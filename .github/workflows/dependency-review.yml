# Dependency vulnerability review
#
# Blocks a pull request that introduces a known-vulnerable dependency, using the
# GitHub Advisory Database. Free for public and private repositories.
#
# This is deliberately separate from `ci.yml`:
#   - this runs on pull requests and only inspects the *diff* of the lockfile
#   - ci.yml runs on pushes and inspects the whole dependency tree
#
# Together they cover "did this PR make things worse" and "is the repo healthy".

name: Dependency Review

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Review dependency changes for known vulnerabilities
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          # SPDX identifiers are case-SENSITIVE. A previous run failed with
          # "Invalid license(s) in allow-licenses" because these were written in
          # lowercase. Correct forms: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause,
          # ISC, 0BSD, Unlicense.
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, 0BSD, Unlicense
          # Show which fixed version resolves an advisory.
          show-patched-versions: true
          comment-summary-in-pr: on-failure