name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Workflow-level so EVERY job gets its own container. A `services:` block
# declared inside a single job gives that job Postgres and leaves the others
# with nothing at localhost:5432 — which is exactly how the e2e job first
# failed. GitHub starts one container per job, so jobs stay isolated.
services:
  postgres:
    image: postgres:16-alpine
    env:
      POSTGRES_USER: tarn
      POSTGRES_PASSWORD: tarn
      POSTGRES_DB: tarn
    ports:
      - 5432:5432
    options: >-
      --health-cmd "pg_isready -U tarn -d tarn"
      --health-interval 5s
      --health-timeout 5s
      --health-retries 10

jobs:
  verify:
    runs-on: ubuntu-latest

    # Top-level env is inherited by every job. Keep it as plain literal values:
    # GitHub does not substitute `${VAR}` inside an env block, so a reference
    # here would resolve to a literal string rather than the job's value.
    env:
      DATABASE_URL: postgresql://tarn:tarn@localhost:5432/tarn?schema=public
      JWT_SECRET: ci-only-jwt-secret
      COOKIE_SECRET: ci-only-cookie-secret
      WEB_ORIGIN: http://localhost:5173
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # Keep in step with packageManager in the root package.json (D-0003).
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          # Single source of truth for the Node version. Keeping this as a bare
          # number in two places is how they drift apart.
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Prisma Client must be generated before typecheck, since the API types
      # depend on the generated client.
      - name: Generate Prisma client
        run: pnpm db:generate

      # Use `db:deploy`, never `migrate dev` in CI (architecture §60).
      - name: Apply migrations
        run: pnpm --filter @tarn/database exec prisma migrate deploy

      - name: Lint
        run: pnpm lint

      # Whole-tree dependency scan (the lockfile-diff review for PRs lives in
      # dependency-review.yml). Dependabot opens the update PRs.
      - name: Audit dependencies for known vulnerabilities
        run: pnpm audit --audit-level=high

      - name: Type check
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build

  # Browser and accessibility tests.
  #
  # These cover the checks jsdom cannot do: colour contrast in a real engine,
  # focus order, 360px layout, and 44px touch targets (DESIGN.md §11).
  #
  # Kept as a separate job from `verify` so the two run in parallel.
  e2e:
    runs-on: ubuntu-latest

    # NOT inherited from the top-level `env`: GitHub does not substitute
    # `${DATABASE_URL}` in a job-level env block, so re-declaring it there
    # would have produced a literal, invalid value. The values are repeated
    # literally instead.
    env:
      NODE_ENV: test
      PORT: 4000
      DATABASE_URL: postgresql://tarn:tarn@localhost:5432/tarn?schema=public
      JWT_SECRET: ci-only-jwt-secret
      COOKIE_SECRET: ci-only-cookie-secret
      WEB_ORIGIN: http://localhost:5173
      SEED_USER_EMAIL: ci-seed@example.com
      SEED_USER_PASSWORD: ci-seed-password
      # Force the bundled Chromium. playwright.config.ts defaults to the
      # system-installed browser for local convenience (msedge), which does not
      # exist on the ubuntu runner. An empty value selects the pinned download,
      # which keeps results reproducible.
      PW_CHANNEL: ''

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply migrations
        run: pnpm --filter @tarn/database exec prisma migrate deploy

      - name: Seed reference data
        run: pnpm db:seed

      # --with-deps installs the Linux system libraries Chromium needs.
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser and accessibility tests
        run: pnpm exec playwright test

      - name: Upload failure artefacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7