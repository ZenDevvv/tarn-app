name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# NOTE: each job declares its OWN `services:` block rather than sharing one at
# workflow level. Sharing is the tidier option, but it produced runs that
# GitHub refused to dispatch (zero jobs, no log). Duplicating the block is
# verbose and explicit, and it is known to work — `verify` has always had its
# own. GitHub starts one container per job either way, so there is no shared
# state to lose.

jobs:
  verify:
    runs-on: ubuntu-latest

    # Database-backed integration tests need Postgres.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tarn
          POSTGRES_PASSWORD: tarn
          POSTGRES_DB: tarn
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tarn -d tarn"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Top-level env is inherited by every job. Keep it as plain literal values:
    # GitHub does not substitute `${VAR}` inside an env block, so a reference
    # here would resolve to a literal string rather than the job's value.
    env:
      DATABASE_URL: postgresql://tarn:tarn@localhost:5432/tarn?schema=public
      JWT_SECRET: ci-only-jwt-secret-at-least-32-characters-long
      COOKIE_SECRET: ci-only-cookie-secret-at-least-32-chars
      WEB_ORIGIN: http://localhost:5173
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # Keep in step with packageManager in the root package.json (D-0003).
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          # Single source of truth for the Node version. Keeping this as a bare
          # number in two places is how they drift apart.
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Prisma Client must be generated before typecheck, since the API types
      # depend on the generated client.
      - name: Generate Prisma client
        run: pnpm db:generate

      # Use `migrate deploy`, never `migrate dev` in CI (architecture §60).
      # This used to be the root `pnpm db:deploy` script, which was broken —
      # `pnpm --filter <pkg> deploy` resolves to pnpm's own built-in `deploy`
      # command, not the package script, so it failed with
      # ERR_PNPM_INVALID_DEPLOY_TARGET. The inline form below worked around it
      # and hid the defect. `pnpm db:deploy` is now fixed and asserted locally;
      # if this line ever regresses to it, the script is broken again.
      - name: Apply migrations
        run: pnpm --filter @tarn/database exec prisma migrate deploy

      - name: Lint
        run: pnpm lint

      # Formatting is a gate, not a suggestion. It failed on 50 pre-existing
      # files until 2026-10-02 (REC-0011); the tree is now clean, so this can
      # be enforced without a large cleanup commit on the first feature branch.
      - name: Check formatting
        run: pnpm format:check

      # Whole-tree dependency scan (the lockfile-diff review for PRs lives in
      # dependency-review.yml). Dependabot opens the update PRs.
      - name: Audit dependencies for known vulnerabilities
        run: pnpm audit --audit-level=high

      - name: Type check
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build

  # Browser and accessibility tests.
  #
  # These cover the checks jsdom cannot do: colour contrast in a real engine,
  # focus order, 360px layout, and 44px touch targets (DESIGN.md §11).
  #
  # Kept as a separate job from `verify` so the two run in parallel.
  e2e:
    runs-on: ubuntu-latest

    # Its own Postgres, matching `verify`. A job-level `services:` block does
    # not inherit the top-level `env`, and a job-level `env` block REPLACES the
    # top-level one rather than merging — so the values are repeated literally.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tarn
          POSTGRES_PASSWORD: tarn
          POSTGRES_DB: tarn
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tarn -d tarn"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      PORT: 4000
      DATABASE_URL: postgresql://tarn:tarn@localhost:5432/tarn?schema=public
      JWT_SECRET: ci-only-jwt-secret-at-least-32-characters-long
      COOKIE_SECRET: ci-only-cookie-secret-at-least-32-chars
      WEB_ORIGIN: http://localhost:5173
      SEED_USER_EMAIL: ci-seed@example.com
      SEED_USER_PASSWORD: ci-seed-password
      # Force the bundled Chromium. playwright.config.ts defaults to the
      # system-installed browser for local convenience (msedge), which does not
      # exist on the ubuntu runner. An empty value selects the pinned download,
      # which keeps results reproducible.
      PW_CHANNEL: ''

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply migrations
        run: pnpm --filter @tarn/database exec prisma migrate deploy

      - name: Seed reference data
        run: pnpm db:seed

      # --with-deps installs the Linux system libraries Chromium needs.
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser and accessibility tests
        run: pnpm exec playwright test

      - name: Upload failure artefacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7