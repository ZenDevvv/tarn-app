name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    # Database-backed integration tests need Postgres (architecture §62).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tarn
          POSTGRES_PASSWORD: tarn
          POSTGRES_DB: tarn
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tarn -d tarn"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://tarn:tarn@localhost:5432/tarn?schema=public
      JWT_SECRET: ci-only-jwt-secret
      COOKIE_SECRET: ci-only-cookie-secret
      WEB_ORIGIN: http://localhost:5173
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # Keep in step with packageManager in the root package.json (D-0003).
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Prisma Client must be generated before typecheck, since the API types
      # depend on the generated client.
      - name: Generate Prisma client
        run: pnpm db:generate

      # Use `db:deploy`, never `migrate dev` in CI (architecture §60).
      - name: Apply migrations
        run: pnpm --filter @tarn/database exec prisma migrate deploy

      - name: Lint
        run: pnpm lint

      # Whole-tree dependency scan (the lockfile-diff review for PRs lives in
      # dependency-review.yml). Dependabot opens the update PRs.
      - name: Audit dependencies for known vulnerabilities
        run: pnpm audit --audit-level=high

      - name: Type check
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build

      # E2E is intentionally not run yet: there are no implemented workflows to
      # drive (architecture §63 lists Playwright as optional at first).