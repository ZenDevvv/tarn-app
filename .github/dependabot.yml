# Automated dependency maintenance.
#
# Free and native to GitHub. Covers both jobs that matter here:
#   - security updates  (GitHub Advisory Database)
#   - version updates   (keeps dependencies current without anyone checking)
#
# ## Why update-types is set at the entry level
#
# Major version bumps are blocked on purpose. `update-types` placed *inside* a
# `groups` block does NOT prevent a major from being proposed — it only controls
# which updates get bundled together. That was learned the hard way: the first
# run after publishing opened 15 pull requests, including TypeScript 5 → 7,
# Vite 6 → 8, @types/node 22 → 26, and Zod 3 → 4, across every package.
#
# Setting `update-types: ["minor", "patch"]` on each update entry caps everything
# at routine bumps. A major becomes deliberate, reviewed work instead of
# something that arrives on a Monday and breaks the build.
#
# The ones already landed deliberately (and verified by hand) are noted below.

version: 2

updates:
  # Root workspace tooling.
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    update-types:
      - minor
      - patch
    labels:
      - dependencies
    groups:
      dev-tooling:
        applies-to: version-updates
        patterns:
          - '@eslint/js'
          - 'eslint'
          - 'prettier'
          - 'typescript'
          - 'vitest'
          - '@vitest/*'
          - 'tsx'
          - 'dotenv-cli'
          - '@playwright/test'
          - '@types/node'
          - 'typescript-eslint'
          - 'globals'

  # Shared packages: Prisma, Zod, and the workspace links.
  - package-ecosystem: npm
    directory: '/packages/database'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    update-types:
      - minor
      - patch
    labels:
      - dependencies
    groups:
      prisma:
        patterns:
          - 'prisma'
          - '@prisma/*'

  - package-ecosystem: npm
    directory: '/packages/validation'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    update-types:
      - minor
      - patch
    labels:
      - dependencies

  - package-ecosystem: npm
    directory: '/packages/types'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    update-types:
      - minor
      - patch
    labels:
      - dependencies

  - package-ecosystem: npm
    directory: '/packages/auth'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    update-types:
      - minor
      - patch
    labels:
      - dependencies

  # API server.
  - package-ecosystem: npm
    directory: '/apps/api'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    update-types:
      - minor
      - patch
    labels:
      - dependencies
    groups:
      # Express and its middleware move together; one PR avoids a half-applied bump.
      api-runtime:
        patterns:
          - 'express'
          - 'cors'
          - 'cookie-parser'
          - 'zod'

  # Web frontend.
  - package-ecosystem: npm
    directory: '/apps/web'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    update-types:
      - minor
      - patch
    labels:
      - dependencies
    groups:
      react-stack:
        patterns:
          - 'react'
          - 'react-dom'
          - 'react-router-dom'
          - '@tanstack/*'

  # GitHub Actions themselves.
  #
  # Note: Dependabot proposed checkout 4 -> 7, setup-node 4 -> 7, and
  # pnpm/action-setup 4 -> 6 on the first run after publishing. Those are NOT
  # applied — this repo still pins v4 — because an unverified three-major
  # jump to CI actions is not something to accept by accident. Revisit them as
  # one deliberate piece of work: read each action's release notes, then
  # upgrade them together and confirm CI still passes.
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    update-types:
      - minor
      - patch
    labels:
      - dependencies
      - ci