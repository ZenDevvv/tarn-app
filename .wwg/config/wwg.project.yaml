  node_pinned_source: .nvmrc
  verification_commands:
    - pnpm lint
    - pnpm typecheck
    - pnpm test
    - pnpm build
    - npx playwright test
  # 90 requires a reachable database. Without one, 7 database integration
  # tests skip loudly and the run reports 83. Re-verified 2026-10-02.
  executable_tests: 90
  executable_tests_without_database: 83
  executable_tests_skipped_without_database: 7
  database_tests_require_docker: true
  browser_tests: 24
  browser_engine: system-installed (msedge default; CI uses pinned chromium)
  format_gate: not enforced in CI; `pnpm format:check` currently fails on 50
    pre-existing files. See REC-0011.
  delivery_pipeline:
    ci: verified on GitHub
    # Observed value, not intent. The GitHub API reports these three contexts;
    # `e2e` is NOT among them, so a red browser-test job does not block a
    # merge. Project Truth records the discrepancy as CONFLICTING under
    # REC-0010, pending an owner decision. Do not "fix" this to match
    # Project Truth without that decision.
    required_checks_observed:
      - verify
      - dependency-review
      - CodeRabbit
    required_checks_intended_per_project_truth:
      - verify
      - e2e
      - dependency-review
      - CodeRabbit
    required_checks_conflict: true
    e2e_runs_but_is_not_required: true
    branch_protection: main, strict mode, enforce_admins true
    ci_last_verified: 2026-10-02
  database:
    engine: postgresql
    version: 16
    migration: 20261001095704_init_mvp_schema
    tables_verified: 10
    deferred_tables_verified_absent: true
